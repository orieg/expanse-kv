# CI for expanse-kv. docs/CI.md describes each job and the rollup gate.
#
# Two rules hold for every edit to this file (AGENTS.md §6):
#   1. A new job is added to `ci-gate.needs`, or its result is never observed.
#   2. Every `uses:` is pinned to a full commit SHA.
# The `ci-integrity` discipline gate fails a pull request that breaks either.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for every job's GITHUB_TOKEN. A job that needs more declares
# its own block.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: "10"

jobs:
  discipline:
    name: Discipline / Diff Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Write access to pull requests so the report is posted as one comment,
    # edited on every run. On a push, the `merged-pr-body` directive source
    # reads the body of the pull request the commit merged through.
    permissions:
      contents: read
      pull-requests: write
      # `ratified-paths` reads the ratification comment on the issue a pull
      # request closes.
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gates diff against the merge base.
          fetch-depth: 0
          persist-credentials: false
      - name: Diff gates (orieg/discipline)
        uses: orieg/discipline@f3d6d4a0bc4f1f60f63fa101aa27e1a17d0d5276 # v0.32.0
        with:
          fail_on_warnings: true
          # Judge the change with main's discipline.toml, so a pull request
          # cannot loosen the policy that judges it.
          policy_from: base
          comment: ${{ github.event_name == 'pull_request' }}

  lint:
    name: Core / Format & Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Docs (warnings denied)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  test:
    name: Core / Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tests
        run: cargo test --workspace --locked
      - name: The binary without a server exits non-zero
        shell: bash
        run: |
          # AGENTS.md §8.1: a build with no server must not look like one that
          # started. Remove this step in the change that adds the listener.
          set +e
          cargo run --quiet --locked -p expanse-kv
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::expanse-kv exited 0 with no server implemented"
            exit 1
          fi
          echo "expanse-kv exited $rc, as a build without a server must"

  msrv:
    name: Core / MSRV Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          v="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          [ -n "${v}" ] || { echo "::error::Cargo.toml declares no rust-version"; exit 1; }
          echo "version=${v}" >> "${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked

  no-std:
    name: Core / expanse-kv-core without std (bare metal)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A target with no `std` at all: a host `--no-default-features` build
      # still links std, and would pass with a stray `std::` path in the crate.
      - run: cargo check -p expanse-kv-core --no-default-features --target thumbv7em-none-eabihf --locked

  supply-chain:
    name: Core / Supply Chain (advisories, licences, sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          # Feature selection lives in deny.toml ([graph] all-features).
          arguments: ""
          # cargo-deny's default omits `licenses`; naming all four keeps it armed.
          command-arguments: advisories bans licenses sources

  ci-gate:
    name: CI Gate / All Checks Passed
    if: always()
    needs:
      - discipline
      - lint
      - test
      - msrv
      - no-std
      - supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate dependency statuses
        shell: bash
        env:
          STATUSES: ${{ toJson(needs) }}
        run: |
          # No job in this workflow is path-filtered, so nothing is expected to
          # skip: only `success` passes. A skipped job is a job that verified
          # nothing (AGENTS.md §8.1).
          FAILED=()
          for job in $(echo "$STATUSES" | jq -r 'keys[]'); do
            result=$(echo "$STATUSES" | jq -r --arg j "$job" '.[$j].result')
            echo "  Job [$job]: $result"
            if [ "$result" != "success" ]; then
              FAILED+=("$job=$result")
            fi
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::Required checks did not succeed: ${FAILED[*]}"
            exit 1
          fi
          echo "::notice::All CI checks succeeded."
