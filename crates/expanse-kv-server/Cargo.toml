[package]
name = "expanse-kv"
description = "Multi-threaded, Redis-protocol-compatible key-value store and cache on the expanse-trie radix trie"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["redis", "resp", "key-value", "cache", "radix-trie"]
categories = ["database-implementations", "caching"]

[lib]
name = "expanse_kv"
path = "src/lib.rs"

[[bin]]
name = "expanse-kv"
path = "src/main.rs"

[dependencies]
expanse-kv-core = { path = "../expanse-kv-core" }
expanse-kv-engine = { path = "../expanse-kv-engine" }
expanse-kv-persist = { path = "../expanse-kv-persist" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }

[lints]
workspace = true
