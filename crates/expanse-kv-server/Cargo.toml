[package]
name = "expanse-kv"
description = "Multi-threaded, Redis-protocol-compatible key-value store and cache on the expanse-trie radix trie"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["redis", "resp", "key-value", "cache", "radix-trie"]
categories = ["database-implementations", "caching"]

[lib]
name = "expanse_kv"
path = "src/lib.rs"

[[bin]]
name = "expanse-kv"
path = "src/main.rs"

[dependencies]
expanse-kv-core = { version = "0.2.0", path = "../expanse-kv-core" }
expanse-kv-engine = { version = "0.2.0", path = "../expanse-kv-engine" }
expanse-kv-persist = { version = "0.2.0", path = "../expanse-kv-persist" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
